name: Publish DrillingRazorMudComponents NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        default: '3.4.9'
        type: string
  push:
    tags:
      - 'drilling-components-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            echo "PACKAGE_VERSION=$REQUESTED_VERSION" >> "$GITHUB_ENV"
          else
            echo "PACKAGE_VERSION=${GITHUB_REF_NAME#drilling-components-v}" >> "$GITHUB_ENV"
          fi

      - name: Set only the component project version
        shell: pwsh
        run: |
          $path = 'DrillingRazorMudComponents/DrillingRazorMudComponents.csproj'
          $project = [xml](Get-Content $path -Raw)
          $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText = $env:PACKAGE_VERSION
          $project.Save((Join-Path $PWD $path))

      - name: Restore
        run: dotnet restore ConversionDrillingRazorMudComponentsUnitTests/ConversionDrillingRazorMudComponentsUnitTests.csproj

      - name: Test paginated unit discovery
        run: dotnet test ConversionDrillingRazorMudComponentsUnitTests/ConversionDrillingRazorMudComponentsUnitTests.csproj --configuration Release --no-restore --filter FullyQualifiedName~UnitSystemDiscoveryClientTests

      - name: Pack
        run: dotnet pack DrillingRazorMudComponents/DrillingRazorMudComponents.csproj --configuration Release --no-build --output artifacts

      - name: Verify package identity and dependency versions
        run: python scripts/verify-component-package.py "artifacts/OSDC.UnitConversion.DrillingRazorMudComponents.${{ env.PACKAGE_VERSION }}.nupkg"

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/OSDC.UnitConversion.DrillingRazorMudComponents.${{ env.PACKAGE_VERSION }}.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
