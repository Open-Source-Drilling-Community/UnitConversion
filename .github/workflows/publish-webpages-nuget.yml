name: Publish WebPages NuGet

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package project to publish
        required: true
        default: WebPages
        type: choice
        options:
          - WebPages
          - DrillingRazorMudComponents
      version:
        description: Package version to publish
        required: true
        type: string
  push:
    tags:
      - "webpages-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PACKAGE_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            TAG="${GITHUB_REF_NAME}"
            echo "PACKAGE_VERSION=${TAG#webpages-v}" >> "$GITHUB_ENV"
          fi

      - name: Resolve package
        shell: bash
        env:
          PACKAGE_PROJECT: ${{ inputs.package || 'WebPages' }}
        run: |
          echo "PACKAGE_PROJECT=$PACKAGE_PROJECT" >> "$GITHUB_ENV"
          echo "PACKAGE_ID=OSDC.UnitConversion.$PACKAGE_PROJECT" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore ${{ env.PACKAGE_PROJECT }}/${{ env.PACKAGE_PROJECT }}.csproj

      - name: Build
        run: dotnet build ${{ env.PACKAGE_PROJECT }}/${{ env.PACKAGE_PROJECT }}.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack ${{ env.PACKAGE_PROJECT }}/${{ env.PACKAGE_PROJECT }}.csproj --configuration Release --no-build -p:PackageVersion=${{ env.PACKAGE_VERSION }} --output artifacts

      - name: Log in to NuGet.org with OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/${{ env.PACKAGE_ID }}.${{ env.PACKAGE_VERSION }}.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --skip-duplicate
